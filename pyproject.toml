[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "residue-experiment"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.5,<2", "python-dotenv>=1,<2"]

[project.optional-dependencies]
api = ["openai>=2,<3", "anthropic>=0.70,<1", "google-genai>=1,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
residue-experiment = "residue_experiment.cli:main"

[tool.setuptools.packages.find]
include = ["residue_experiment*"]
