name: Instruction experiment tests
on:
  pull_request:
    paths:
      - 'residue_experiment/**'
      - 'tests/**'
      - 'config.openrouter.instructions.json'
      - 'config.openrouter.prompt-methods.json'
      - 'pyproject.toml'
      - '.github/workflows/instruction-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[api,test]"
      - name: Validate real archived baselines without API calls
        run: |
          python -m residue_experiment.instruction_repeats --provider openai --mode dry-run --output "$RUNNER_TEMP/archived-openai-check"
          python -m residue_experiment.instruction_repeats --provider anthropic --mode dry-run --output "$RUNNER_TEMP/archived-anthropic-check"
          python -m residue_experiment.instruction_repeats --provider gemini --mode dry-run --output "$RUNNER_TEMP/archived-gemini-check"
      - name: Validate GPT P3 P4 P5 with no API calls
        run: python -m residue_experiment.prompt_method_repeats --mode dry-run --output "$RUNNER_TEMP/gpt-prompt-methods-check"
      - name: Validate E6 guided with archived examples and no API calls
        run: python -m residue_experiment.e6_guided --mode dry-run --output "$RUNNER_TEMP/e6-guided-check"
      - name: Validate G1 G2 G3 two-round plans without API calls
        run: python -m residue_experiment.e6_ablation --mode dry-run --output "$RUNNER_TEMP/e6-ablation-check"
      - name: Validate C0 H1 three-round plans without API calls
        run: python -m residue_experiment.e6_h1 --mode dry-run --output "$RUNNER_TEMP/e6-h1-check"
      - name: Validate J1 purpose routing without API calls
        run: python -m residue_experiment.e6_j1 --mode dry-run --output "$RUNNER_TEMP/e6-j1-check"
      - name: Validate controlled purpose comparison without API calls
        run: python -m residue_experiment.e6_purpose_control --mode dry-run --output "$RUNNER_TEMP/e6-purpose-control-check"
      - name: Validate 2026 final evaluation without API calls
        run: python -m residue_experiment.e6_final_2026 --mode dry-run --output "$RUNNER_TEMP/e6-final-2026-check"
      - name: Validate original E6 and P3 on 2026 without API calls
        run: python -m residue_experiment.e6_p3_final_2026 --mode dry-run --output "$RUNNER_TEMP/e6-p3-final-2026-check"
      - name: Tests without real model API calls
        run: python -m pytest -q tests
